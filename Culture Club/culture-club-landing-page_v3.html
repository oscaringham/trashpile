<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture Club</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: auto;
        }

        @font-face {
            font-family: 'CaslonIonic';
            src: url('../CaslonIonic-Regular.otf') format('opentype');
            font-weight: 400;
        }

        #cc-widget {
            font-family: 'CaslonIonic', serif;
            background: #ffffff;
            position: relative;
            box-sizing: border-box;
            width: 100%;
            height: auto;
            min-height: 280px;
            overflow: hidden;
        }

        #cc-bubble-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .cc-bubble {
            position: absolute;
            top: 0;
            left: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform;
        }

        .cc-content {
            position: relative;
            z-index: 1;
            padding: clamp(20px, 5vw, 40px) 20px;
        }

        #cc-widget h1 {
            font-family: 'CaslonIonic', serif;
            font-weight: 400;
            font-size: clamp(36px, 11vw, 92px);
            line-height: 1;
            letter-spacing: -0.01em;
            color: #000;
            margin: 0;
            padding: 0;
        }

        .cc-standfirst {
            font-family: 'CaslonIonic', serif;
            font-weight: 400;
            font-size: clamp(14px, 2.5vw, 18px);
            line-height: 1.5;
            color: #000;
            margin: clamp(12px, 3vw, 24px) 0 0 0;
            padding: 0;
            max-width: 600px;
        }

        .cc-subscribe-btn {
            display: inline-block;
            margin-top: clamp(16px, 3vw, 28px);
            padding: 14px 36px;
            background-color: #FF5D66;
            color: #000000;
            font-family: 'CaslonIonic', serif;
            font-size: clamp(14px, 2vw, 17px);
            font-weight: 400;
            letter-spacing: 0.02em;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div id="cc-widget">
        <div id="cc-bubble-layer"></div>
        <div class="cc-content">
            <h1>Culture<br>Club</h1>
            <p class="cc-standfirst">The Observer Culture Club invites our subscribers into the best in arts, culture and ideas - from exhibition and tickets to hand-picked travel escapes and the best of independent cinema.</p>
            <p class="cc-standfirst">Become an Observer subscriber today to unlock over £650 of benefits.</p>
            <a href="https://www.observer.co.uk/subscribe" class="cc-subscribe-btn">Subscribe</a>
        </div>
    </div>

    <script>
        (function () {
            var widget = document.getElementById('cc-widget');
            var layer  = document.getElementById('cc-bubble-layer');
            if (!widget || !layer) return;

            var colours = ['#A93949','#FF5D66','#FFB2B2','#70A9D9','#AAD9FF','#857BB0','#B5B0D0'];
            var count = 24;
            var w = widget.offsetWidth  || 800;
            var h = widget.offsetHeight || 280;

            for (var i = 0; i < count; i++) {
                var colour = colours[i % colours.length];
                var el = document.createElement('div');
                el.className = 'cc-bubble';
                el.style.background = colour;
                var redColours = ['#A93949','#FF5D66'];
                var purpleColours = ['#857BB0','#B5B0D0'];
                el.style.zIndex = redColours.indexOf(colour) > -1 ? '2' : '0';
                layer.appendChild(el);

                (function(elem, ox, oy, rx, ry, ph, sp) {
                    function tick(t) {
                        var x = ox + Math.cos(t * sp + ph) * rx;
                        var y = oy + Math.sin(t * sp + ph * 1.3) * ry;
                        elem.style.transform = 'translate(' + x + 'px,' + y + 'px)';
                        requestAnimationFrame(tick);
                    }
                    requestAnimationFrame(tick);
                }(
                    el,
                    ((15 + (i * 13) % 70) / 100) * w,
                    ((20 + (i * 17) % 60) / 100) * h,
                    20 + (i * 13) % 40,
                    10 + (i * 9)  % 20,
                    (i / count) * Math.PI * 2,
                    0.00008 + (i * 0.000012)
                ));
            }
        }());

        // Send height to parent so the iframe can resize dynamically.
        // Only fires at stable layout moments — no resize/ResizeObserver listeners,
        // which caused feedback loops when the parent changed the iframe height.
        function sendHeight() {
            var widget = document.getElementById('cc-widget');
            var h = widget ? widget.offsetHeight : document.documentElement.scrollHeight;
            if (h > 0) {
                window.parent.postMessage({ ccWidgetHeight: h }, '*');
            }
        }

        window.addEventListener('load', sendHeight);

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(sendHeight);
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Culture Club</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: auto;
        }

        @font-face {
            font-family: 'CaslonIonic';
            src: url('../CaslonIonic-Regular.otf') format('opentype');
            font-weight: 400;
        }

        #cc-widget {
            font-family: 'CaslonIonic', serif;
            background: #ffffff;
            position: relative;
            box-sizing: border-box;
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        #cc-bubble-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .cc-bubble {
            position: absolute;
            top: 0;
            left: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform;
        }

        .cc-content {
            position: relative;
            z-index: 1;
            padding: 40px 80px;
        }

        #cc-widget h1 {
            font-family: 'CaslonIonic', serif;
            font-weight: 400;
            font-size: 100px;
            line-height: 1;
            letter-spacing: -0.01em;
            color: #000;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="cc-widget">
        <div id="cc-bubble-layer"></div>
        <div class="cc-content">
            <h1>Culture<br>Club</h1>
        </div>
    </div>

    <script>
        (function () {
            var widget = document.getElementById('cc-widget');
            var layer  = document.getElementById('cc-bubble-layer');
            if (!widget || !layer) return;

            var colours = ['#A93949','#FF5D66','#FFB2B2','#70A9D9','#AAD9FF','#857BB0','#B5B0D0'];
            var count = 28;
            var w = widget.offsetWidth  || 800;
            var h = widget.offsetHeight || 280;

            for (var i = 0; i < count; i++) {
                var el = document.createElement('div');
                el.className = 'cc-bubble';
                el.style.background = colours[i % colours.length];
                layer.appendChild(el);

                (function(elem, ox, oy, rx, ry, ph, sp) {
                    function tick(t) {
                        var x = ox + Math.cos(t * sp + ph) * rx;
                        var y = oy + Math.sin(t * sp + ph * 1.3) * ry;
                        elem.style.transform = 'translate(' + x + 'px,' + y + 'px)';
                        requestAnimationFrame(tick);
                    }
                    requestAnimationFrame(tick);
                }(
                    el,
                    ((5  + (i * 13) % 90) / 100) * w,
                    ((10 + (i * 17) % 80) / 100) * h,
                    30 + (i * 23) % 80,
                    15 + (i * 17) % 40,
                    (i / count) * Math.PI * 2,
                    0.00008 + (i * 0.000012)
                ));
            }
        }());
    </script>

</body>
</html>
